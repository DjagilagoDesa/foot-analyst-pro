name: Android preview
on:
  workflow_dispatch:
  push:
    branches: [main, playstore-preparation-v45]
    paths: ['android/**', '.github/workflows/android-preview.yml']
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon -p android :app:assembleDebug :app:bundleRelease :app:lintDebug :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: FOOT-ANALYST-PRO-1.0.0-preview-UNSIGNED
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-release.html
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

