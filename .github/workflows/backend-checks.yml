name: Backend and calendar checks
on:
  push:
    branches: [live-scores-v46, profile-v47, analysis-premium-v48]
  pull_request:
    paths: ['app.py', 'accounts.py', 'profile.js', 'engine.py', 'index.html', 'tests/**', '.github/workflows/backend-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foot_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: foot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foot_test -d foot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://foot_test:ci-only-password@localhost:5432/foot_test
      - run: node --check profile.js
      - run: node tests/test_calendar.js
      - name: Install mobile browser test tools
        run: |
          npm --prefix "$RUNNER_TEMP/profile-browser" install playwright@1.56.1
          "$RUNNER_TEMP/profile-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check profile on mobile viewport
        env:
          NODE_PATH: ${{ runner.temp }}/profile-browser/node_modules
          PYTHONPATH: .
        run: |
          python tests/serve_profile.py > "$RUNNER_TEMP/profile-ui.log" 2>&1 &
          node tests/test_profile_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-mobile-preview
          path: artifacts/profile-mobile.png
          if-no-files-found: ignore
