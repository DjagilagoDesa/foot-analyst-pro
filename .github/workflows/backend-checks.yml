name: Backend and calendar checks
on:
  push:
    branches: [live-scores-v46]
  pull_request:
    paths: ['app.py', 'engine.py', 'index.html', 'tests/**', '.github/workflows/backend-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_calendar.js
