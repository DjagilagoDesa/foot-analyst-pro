name: Backend and calendar checks
on:
  workflow_dispatch:
  push:
    branches: [main, live-scores-v46, profile-v47, analysis-premium-v48]
  pull_request:
    paths: ['match_availability.py', 'personnel.js', 'docs/PERSONNEL_CONTEXT.md', 'shadow_experiment.py', 'opponent_review.py', 'shadow_seed.json.gz', 'docs/SHADOW_EXPERIMENT.md', 'opponent_benchmark.py', 'tools/benchmark_opponents.py', 'tools/collect_opponent_archive.py', 'docs/opponent-research.md', 'app.py', 'accounts.py', 'profile.js', 'engine.py', 'analysis_report.py', 'daily_opinion.py', 'custom-ticket.js', 'daily-tickets.js', 'Dockerfile', 'index.html', 'tests/**', '.github/workflows/backend-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foot_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: foot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foot_test -d foot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://foot_test:ci-only-password@localhost:5432/foot_test
      - run: node --check personnel.js
      - run: node --check profile.js
      - run: node tests/test_calendar.js
      - run: node --check ticket-builder.js
      - run: node tests/test_ticket_builder.cjs
      - name: Install mobile browser test tools
        run: |
          npm --prefix "$RUNNER_TEMP/profile-browser" install playwright@1.56.1
          "$RUNNER_TEMP/profile-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check profile on mobile viewport
        env:
          NODE_PATH: ${{ runner.temp }}/profile-browser/node_modules
          PYTHONPATH: .
        run: |
          python tests/serve_profile.py > "$RUNNER_TEMP/profile-ui.log" 2>&1 &
          node tests/test_profile_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-mobile-preview
          path: |
            artifacts/profile-mobile.png
            artifacts/personnel-mobile.png
          if-no-files-found: ignore

  opponent-research:
    if: github.event_name == 'pull_request' && github.head_ref == 'opponent-strength-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect retrospective archive with explicit coverage audit
        id: archive
        continue-on-error: true
        run: >-
          python tools/collect_opponent_archive.py
          --leagues eng.1 esp.1 ita.1 ger.1 fra.1 por.1 ned.1 uefa.champions
          --start 2025-09-01 --end 2025-11-30
          --output opponent-archive.json
      - name: Compare frozen models on validation and held-out November fixtures
        if: steps.archive.outcome == 'success'
        run: >-
          python tools/benchmark_opponents.py --input opponent-archive.json
          --validation-from 2025-10-01T00:00:00Z --test-from 2025-11-01T00:00:00Z
          --output opponent-benchmark-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opponent-research-evidence
          path: |
            opponent-archive.json
            opponent-archive.json.coverage.json
            opponent-benchmark-report.json
          retention-days: 30
