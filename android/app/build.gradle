plugins { id 'com.android.application' }
def signingNames = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def signingReady = signingNames.every { System.getenv(it) }
def configuredVersionCode = Integer.parseInt(project.findProperty('releaseVersionCode')?.toString() ?: '2')
if (project.findProperty('requireReleaseSigning') == 'true' && !signingReady) {
    throw new GradleException('Release signing is required. Configure the four Android signing secrets outside this repository.')
}
android {
    namespace 'fr.footanalystpro.app'
    compileSdk 36
    defaultConfig {
        applicationId 'fr.footanalystpro.app'
        minSdk 26
        targetSdk 36
        versionCode = configuredVersionCode
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingReady) signingConfig signingConfigs.release
        }
    }
}


dependencies {
    // Align legacy jdk7/jdk8 transitives with the merged Kotlin standard library.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'androidx.webkit:webkit:1.14.0'
}
